<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memejector — Wall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23ff8a2b'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    cursor: none;
    -webkit-user-select: none; user-select: none;
  }
  #wall { display: block; width: 100vw; height: 100vh; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    color: #6b5b4a; font: 14px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: .18em; text-transform: uppercase;
  }
  #boot.gone { display: none; }
</style>
</head>
<body>
  <canvas id="wall"></canvas>
  <div id="boot">memejector</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
